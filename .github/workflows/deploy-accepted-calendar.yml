name: Deploy accepted Japanese calendar

on:
  workflow_dispatch:
    inputs:
      accepted_tag:
        description: Published Accepted Release tag to deploy
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      ACCEPTED_TAG: ${{ inputs.accepted_tag }}
      ASSET_DIR: ${{ runner.temp }}/accepted-release
      SITE_DIR: ${{ runner.temp }}/pages-site
    steps:
      - name: Check out distribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fetch published Accepted Release assets
        run: >-
          python scripts/fetch_release_assets.py
          --accepted-tag "$ACCEPTED_TAG"
          --output "$ASSET_DIR"

      - name: Validate Release assets
        run: >-
          python scripts/validate_release_assets.py
          --assets "$ASSET_DIR"
          --accepted-tag "$ACCEPTED_TAG"

      - name: Build Pages artifact
        run: >-
          python scripts/build_pages_artifact.py
          --repository .
          --assets "$ASSET_DIR"
          --output "$SITE_DIR"
          --accepted-tag "$ACCEPTED_TAG"

      - name: Validate Pages artifact
        run: >-
          python scripts/validate_pages_output.py
          --site "$SITE_DIR"
          --assets "$ASSET_DIR"
          --accepted-tag "$ACCEPTED_TAG"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
